<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dawn Patrol</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A171C; color: #E7F1F3; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 30rem; padding: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1rem; color: #A9C0C6; }
  button { font: inherit; padding: .6rem 1.1rem; border-radius: 8px; border: 0; background: #3FB6C8; color: #06151A; cursor: pointer; }
  button:focus-visible { outline: 3px solid #E7F1F3; outline-offset: 2px; }
</style></head>
<body><main>
  <h1>Can't reach Dawn Patrol</h1>
  <p>Check your internet connection. Forecasts need to be online, but spots and settings you saved are kept on this computer.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.href = 'https://dawnpatrol.casadelfuego.org'; });
  window.addEventListener('online', function () { location.href = 'https://dawnpatrol.casadelfuego.org'; });
</script></body></html>
